name: Validate PatentRadar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:private-build
      - run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: |
          export CHROMIUM_PATH="$(node -p 'require("@playwright/test").chromium.executablePath()')"
          npm run test:e2e
  native-cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-venv libgl1 libglib2.0-0 libxrender1 libsm6
      - run: python3 -m venv /tmp/cad-env && /tmp/cad-env/bin/pip install -r cad/requirements.txt
      - run: /tmp/cad-env/bin/python cad/test_worker.py
