name: Validate PatentRadar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:sdk
      - run: npm run build
      - run: npm run check:private-build
      - run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: |
          export CHROMIUM_PATH="$(node -p 'require("@playwright/test").chromium.executablePath()')"
          npm run test:e2e
      - name: Preserve browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-diagnostics
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  native-cad:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-venv libgl1 libglib2.0-0 libxrender1 libsm6
      - run: python3 -m venv /tmp/cad-env && /tmp/cad-env/bin/pip install -r services/cad/requirements.txt
      - run: /tmp/cad-env/bin/python services/cad/test_worker.py
