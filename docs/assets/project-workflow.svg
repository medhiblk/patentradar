<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="230" viewBox="0 0 1120 230" role="img" aria-labelledby="title description">
  <title id="title">From technical documents to informed design</title>
  <desc id="description">Bring a document, review its features, explore measured parts, investigate patent evidence, and iterate with context. Patent research can also be used independently of CAD.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#7393ce"/></marker></defs>
  <rect width="1120" height="230" rx="16" fill="#f2f6ff"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="28" y="35" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#49648f">ONE PROJECT. CONNECTED WAYS TO INVESTIGATE.</text>
    <g fill="#fff" stroke="#d3dff2"><rect x="28" y="60" width="192" height="112" rx="9"/><rect x="246" y="60" width="192" height="112" rx="9"/><rect x="464" y="60" width="192" height="112" rx="9"/><rect x="682" y="60" width="192" height="112" rx="9"/><rect x="900" y="60" width="192" height="112" rx="9"/></g>
    <g stroke="#7393ce" marker-end="url(#arrow)"><path d="M225 116h15"/><path d="M443 116h15"/><path d="M661 116h15"/><path d="M879 116h15"/></g>
    <g font-size="10" fill="#2554db"><text x="44" y="85">01 / BRING</text><text x="262" y="85">02 / REVIEW</text><text x="480" y="85">03 / EXPLORE</text><text x="698" y="85">04 / INVESTIGATE</text><text x="916" y="85">05 / ITERATE</text></g>
    <g font-size="17" font-weight="bold" fill="#172a49"><text x="44" y="114">Your starting point</text><text x="262" y="114">Technical features</text><text x="480" y="114">Measured parts</text><text x="698" y="114">Patent evidence</text><text x="916" y="114">An informed next step</text></g>
    <g font-size="12" fill="#506078"><text x="44" y="140">PDF, description or specs</text><text x="262" y="140">Check sources and dimensions</text><text x="480" y="140">Edit and inspect geometry</text><text x="698" y="140">Read passages and sources</text><text x="916" y="140">Save, compare and revisit</text></g>
    <text x="28" y="204" font-size="12" fill="#506078">Use patent research on its own, or connect it to the engineering workflow. CAD is optional.</text>
  </g>
</svg>
